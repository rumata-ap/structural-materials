[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-materials"
version = "0.2.0"
description = "Расчет нормативных характеристик строительных материалов (СП 15, СП 16, СП 63)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aleksandr Ponomarev", email = "palexxvlad@yandex.ru" }
]
license = { text = "MIT" }
keywords = [
    "structural-engineering",
    "materials",
    "concrete",
    "rebar",
    "steel",
    "masonry",
    "sp63",
    "sp16",
    "sp15",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/rumata-ap/structural-materials"
Documentation = "https://structural-materials.readthedocs.io/"
Repository = "https://github.com/rumata-ap/structural-materials.git"
Issues = "https://github.com/rumata-ap/structural-materials/issues"

[project.optional-dependencies]
notebooks = [
    "matplotlib",
    "ipywidgets>=8.0",
    "IPython",
]
docs = [
    "sphinx>=7.0",
    "furo>=2023.9.10",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.2",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["structural_materials*"]

[tool.setuptools.package-data]
structural_materials = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "structural_materials", "scripts"]
